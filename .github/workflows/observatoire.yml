name: Observatoire des prix (mise à jour mensuelle)
on:
  schedule:
    - cron: "17 6 20 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas statsmodels
      - run: python tools/export_observatoire.py assets/data/observatoire.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/observatoire.json
          git diff --cached --quiet || (git commit -m "Observatoire : données du mois" && git push)
